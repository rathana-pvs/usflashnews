services:
  db:
    image: postgres:15-alpine
    container_name: usflashnews-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usflashnews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usflashnews_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-usflashnews}
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - usflashnews_db_data:/var/lib/postgresql/data

volumes:
  usflashnews_db_data:

