# ── Rate Limiting ──────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=usflashnews_api:10m rate=10r/s;

# ── HTTP Server (Supports Cloudflare Flexible + Direct HTTP) ───
server {
    listen 80;
    listen [::]:80;
    server_name usflashnews.com www.usflashnews.com;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ── Serve uploaded media directly from disk ───────────────
    location /media/ {
        alias /var/www/usflashnews/public/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Cache static Next.js assets aggressively ─────────────
    location /_next/static/ {
        alias /var/www/usflashnews/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ── Rate limit the Payload CMS API ────────────────────────
    location /api/ {
        limit_req zone=usflashnews_api burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Proxy to PM2 port 3004 ──────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}

# ── HTTPS Main Server ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usflashnews.com www.usflashnews.com;

    client_max_body_size 50M;

    # SSL certificates
    ssl_certificate     /etc/letsencrypt/live/usflashnews.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usflashnews.com/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_USFLASHNEWS:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── Serve uploaded media directly from disk ───────────────
    location /media/ {
        alias /var/www/usflashnews/public/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Cache static Next.js assets aggressively ─────────────
    location /_next/static/ {
        alias /var/www/usflashnews/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ── Rate limit the Payload CMS API ────────────────────────
    location /api/ {
        limit_req zone=usflashnews_api burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Proxy to PM2 (Next.js & Payload on Port 3004) ────────
    location / {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
